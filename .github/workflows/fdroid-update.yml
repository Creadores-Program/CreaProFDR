name: Sync Repo F-Droid

on:
  schedule:
    - cron: '0 0 1,15 * *'
  
  workflow_dispatch:

  repository_dispatch:
    types: [app_updated]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Config Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools libjpeg-dev zlib1g-dev
          sudo pip3 install --upgrade --break-system-packages --ignore-installed typing_extensions fdroidserver

      - name: Set Key
        run: echo "${{ secrets.CREAPROFDRKEYAPPB }}" | base64 -d > CreaProFDR.keystore

      - name: Download APKs vía Node.js
        run: node sync.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREAPROFDRKEYCONTRE: ${{ secrets.CREAPROFDRKEYCONTRE }}

      - name: Update F-Droid
        run: |
          if [ ! -f "config.yml" ]; then
            fdroid init --no-prompt
          fi
          chmod 600 config.yml
          fdroid update --create-metadata
      - name: Prepare dist
        run: |
          mkdir -p dist
          mkdir -p dist/stats

          cp -r repo dist/

          keytool -exportcert -alias CreaProFDRkey -keystore CreaProFDR.keystore -storepass "${{ secrets.CREAPROFDRKEYCONTRE }}" | xxd -p | tr -d '\n' > dist/stats/pubkey
      - name: Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
